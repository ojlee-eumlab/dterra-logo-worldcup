   ===================================================================== */

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<style>
:root{--ink:#18181B;--muted:#60606C;--soft:#93939F;--line:#E4E4E7;--bg:#F5F5F8;--acc:#08214D;--acc2:#E8EFFD;--danger:#C42B1C}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding:28px 18px 64px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:20px;margin:0}
.demo{background:#FFF7E6;border:1px solid #F3D9A4;color:#7A5200;font-size:12.5px;padding:8px 12px;border-radius:6px;margin-bottom:14px}
.panel{background:#fff;border:1px solid var(--line);border-radius:8px;padding:22px}
.muted{color:var(--muted)}.small{font-size:12.5px}
.btn{appearance:none;border:1px solid var(--acc);background:var(--acc);color:#fff;font:600 14px inherit;font-family:inherit;padding:10px 18px;border-radius:6px;cursor:pointer}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.danger{background:#fff;color:var(--danger);border-color:#EBC3BF}
.btn.sm{font-size:12.5px;padding:6px 10px}
input[type=text]{font:15px inherit;font-family:inherit;padding:10px 12px;border:1px solid #C9C9CF;border-radius:6px;width:100%;max-width:320px}
input[type=text]:focus{outline:2px solid #A3C1F5;border-color:var(--acc)}
.err{color:var(--danger);font-size:13px;min-height:18px;margin-top:6px}
.start{max-width:520px;margin:40px auto;text-align:center}
.start h2{font-size:24px;margin:0 0 8px}.start .row{display:flex;gap:8px;justify-content:center;margin-top:18px;flex-wrap:wrap}
/* 대결 */
.progress{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.round{font-weight:700;font-size:16px}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:16px}.bar i{display:block;height:100%;background:var(--acc);transition:width .25s}
.duel{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cand{background:#fff;border:1px solid var(--line);border-radius:10px;padding:0;cursor:pointer;display:flex;flex-direction:column;text-align:left;font:inherit;color:inherit;transition:border-color .15s,box-shadow .15s,transform .15s,opacity .18s}
.cand:hover{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc2)}
.cand:focus-visible{outline:3px solid #A3C1F5}
.cand .stage{background:#FFFFFF;height:220px;display:flex;align-items:center;justify-content:center;padding:24px;border-bottom:1px solid #EEF0F3;border-radius:10px 10px 0 0}
.cand .stage svg{height:64px;width:auto;max-width:100%}
.cand .gnb{display:flex;align-items:center;height:44px;padding:0 14px;background:#FFFFFF;border-bottom:1px solid #EEF0F3}
.cand .gnb svg{height:28px;width:auto}
.cand .gnb .nav{margin-left:18px;display:flex;gap:12px;font-size:11.5px;color:#93939F;white-space:nowrap;overflow:hidden}
.cand .meta{padding:9px 14px;font-size:11.5px;color:var(--soft)}
.cand.picked{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc2);transform:scale(.99)}
.cand.lost{opacity:.25}
.vs{display:none}
/* 우승 */
.win{text-align:center;padding:36px 20px}.win .stage{background:#fff;border:1px solid var(--line);border-radius:10px;padding:36px;margin:18px auto;max-width:520px}.win .stage svg{height:72px;width:auto;max-width:100%}
/* 현황 */
.notice{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:14px;font-size:14px}
.notice svg{height:24px;width:auto}
.kpis{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.kpi{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 16px;min-width:180px}.kpi b{display:block;font-size:20px;margin-top:2px}.kpi span{font-size:12px;color:var(--muted)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}.live i{width:7px;height:7px;border-radius:50%;background:#2E9E5B;display:inline-block}
table{width:100%;border-collapse:collapse;background:#fff;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;white-space:nowrap}
th{background:#FAFAFC;font-weight:600;color:#484851;position:sticky;top:0}
th.sort{cursor:pointer;user-select:none}th.sort:hover{color:var(--acc)}th .ar{color:var(--soft);font-size:11px;margin-left:3px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.thumb svg{height:22px;width:auto;display:block}
.tablewrap{border:1px solid var(--line);border-radius:8px;overflow:auto}
.sec{margin-top:22px}.sec h3{font-size:15px;margin:0 0 10px}
.chart{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.crow{display:grid;grid-template-columns:150px 1fr 40px;align-items:center;gap:10px;font-size:12.5px;padding:4px 0}
.crow .lbl{display:flex;align-items:center;gap:8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.crow .lbl svg{height:16px;width:auto;flex:none}
.crow .track{height:12px;background:#F0F1F4;border-radius:3px;overflow:hidden}.crow .track i{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width .3s}
.crow .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
/* 관리자 */
.adminbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
tr.person{cursor:pointer}tr.person:hover td{background:#FAFAFC}
tr.detail td{background:#FAFBFD;white-space:normal}
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px;padding:4px 0}
.m{display:flex;align-items:center;gap:6px;font-size:12px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.m .r{color:var(--soft);width:34px;flex:none}.m .pick{font-weight:700;color:var(--acc)}.m .lose{color:var(--soft);text-decoration:line-through}
.empty{padding:28px;text-align:center;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:8px}
@media (max-width:720px){
 .duel{grid-template-columns:1fr}.cand .stage{height:150px}.cand .stage svg{height:48px}
 .crow{grid-template-columns:110px 1fr 32px}
 .wrap{padding:18px 12px 48px}
}
</style>
</head>

    async remove(pid){ write(read().filter(r=>r.pid!==pid)); },

const demoBanner = REMOTE ? '' : `<div class="demo">체험 모드입니다. 결과가 이 브라우저에만 저장되어 다른 사람과 공유되지 않습니다. 공유하려면 파일 맨 위 설정 칸에 Supabase 키를 넣어 주세요.</div>`;

/* ---------------- 집계 ---------------- */
function aggregate(rows){
  const n=rows.length; const s={};
  LOGOS.forEach(l=>s[l.id]={id:l.id,wins:0,played:0,won:0});
  rows.forEach(r=>{ if(s[r.winner]) s[r.winner].wins++; (r.matches||[]).forEach(m=>{ [m.a,m.b].forEach(x=>{ if(s[x]) s[x].played++; }); if(s[m.pick]) s[m.pick].won++; }); });
  return Object.values(s).map(x=>({...x, winRate:n? x.wins/n:0, matchRate:x.played? x.won/x.played:0}));
}
const pct = v => (v*100).toFixed(1)+'%';
let sortKey='wins', sortDir=-1;
function sorted(stats){
  const k=sortKey,d=sortDir;
  return [...stats].sort((a,b)=>{
    let va=a[k],vb=b[k];
    if(k==='name'){ va=BY[a.id].name; vb=BY[b.id].name; return d*va.localeCompare(vb,'ko'); }
    if(va!==vb) return d*(va-vb);
    if(b.matchRate!==a.matchRate) return b.matchRate-a.matchRate;
    return a.id.localeCompare(b.id);
  });
}
function rankOf(stats){ // 우승 횟수 → 판 승률 기준 순위(동률 같은 순위)
  const base=[...stats].sort((a,b)=>b.wins-a.wins||b.matchRate-a.matchRate);
  const r={}; base.forEach((x,i)=>{ const p=base[i-1]; r[x.id]=(p&&p.wins===x.wins&&p.matchRate===x.matchRate)?r[p.id]:i+1; }); return r;
}
function statusHTML(rows){
  const stats=aggregate(rows); const rank=rankOf(stats); const n=rows.length;
  const last=rows.length? rows.reduce((m,r)=>r.created_at>m?r.created_at:m,rows[0].created_at):null;
  const arrow=k=> sortKey===k ? `<span class="ar">${sortDir<0?'▼':'▲'}</span>` : '';
  const maxW=Math.max(1,...stats.map(s=>s.wins));
  const body=sorted(stats).map(s=>`<tr><td class="num">${rank[s.id]}</td><td class="thumb">${BY[s.id].lockup}</td><td>${esc(BY[s.id].name)} <span class="muted small">${s.id}</span></td><td class="num">${s.wins}</td><td class="num">${pct(s.winRate)}</td><td class="num">${s.played?pct(s.matchRate):'-'} <span class="muted small">(${s.won}/${s.played})</span></td></tr>`).join('');
  const chart=[...stats].sort((a,b)=>b.wins-a.wins||b.matchRate-a.matchRate).map(s=>`<div class="crow"><div class="lbl">${BY[s.id].symbol}<span>${esc(BY[s.id].name)}</span></div><div class="track"><i style="width:${(s.wins/maxW*100).toFixed(1)}%"></i></div><div class="v">${s.wins}</div></div>`).join('');
  return `<div class="kpis"><div class="kpi"><span>참여 인원</span><b>${n}명</b></div><div class="kpi"><span>마지막 참여 시각</span><b style="font-size:15px">${fmt(last)}</b></div><div class="kpi" style="display:flex;align-items:center"><span class="live"><i></i>새 참여가 들어오면 바로 반영됩니다</span></div></div>
  <div class="tablewrap"><table><thead><tr><th class="num sort" data-k="rank">순위</th><th>로고</th><th class="sort" data-k="name">이름${arrow('name')}</th><th class="num sort" data-k="wins">우승 횟수${arrow('wins')}</th><th class="num sort" data-k="winRate">우승률${arrow('winRate')}</th><th class="num sort" data-k="matchRate">판 승률${arrow('matchRate')}</th></tr></thead><tbody>${body}</tbody></table></div>
  <div class="sec"><h3>우승 횟수</h3><div class="chart">${chart}</div></div>`;
}
function bindSort(rerender){
  app.querySelectorAll('th.sort').forEach(th=>th.onclick=()=>{ let k=th.dataset.k; if(k==='rank'){k='wins';} if(sortKey===k) sortDir=-sortDir; else { sortKey=k; sortDir=(k==='name')?1:-1; } rerender(); });
}

/* ---------------- 참여 화면 ---------------- */
let me={pid:null,name:''};

  <p class="small muted" style="margin-top:18px">16개 시안이 두 개씩 맞붙습니다. 더 나은 쪽을 누르면 다음 판으로 넘어가고, 고른 판은 되돌릴 수 없습니다.</p></div>`;
  const nm=document.getElementById('nm'), go=document.getElementById('go'), err=document.getElementById('err');

function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
let B;
function startBracket(){ B={size:16, pool:shuffle(LOGOS.map(l=>l.id)), next:[], idx:0, matches:[], done:0}; duel(); }
function card(id,side){ const l=BY[id]; return `<button class="cand" data-id="${id}" data-side="${side}" aria-label="${esc(l.name)} 선택"><div class="stage">${l.lockup}</div><div class="gnb">${l.lockup}<div class="nav"><span>기본정보</span><span>필터링</span><span>EDI</span><span>정산</span></div></div><div class="meta">${esc(l.name)}</div></button>`; }
function duel(){
  const total=B.size/2, i=B.idx;
  const a=B.pool[i*2], b=B.pool[i*2+1];
  app.innerHTML=`${demoBanner}<div class="progress"><div class="round">${ROUND_NAMES[B.size]} ${i+1}/${total}</div><div class="small muted">${esc(me.name)} 님 · 더 나은 로고를 눌러 주세요</div></div>
   <div class="bar"><i style="width:${(B.done/15*100).toFixed(1)}%"></i></div><div class="duel">${card(a,'L')}${card(b,'R')}</div>`;
  let locked=false;
  app.querySelectorAll('.cand').forEach(el=>el.onclick=()=>{ if(locked) return; locked=true;
    const pick=el.dataset.id; el.classList.add('picked'); app.querySelectorAll('.cand').forEach(o=>{ if(o!==el) o.classList.add('lost'); });
    B.matches.push({round:ROUND_NAMES[B.size],a,b,pick}); B.next.push(pick); B.done++;
    setTimeout(()=>advance(),220);
  });
}
async function advance(){
  B.idx++;
  if(B.idx<B.size/2) return duel();
  if(B.size===2){ return finish(B.next[0]); }
  B.size/=2; B.pool=shuffle(B.next); B.next=[]; B.idx=0; duel();
}
async function finish(winner){

    app.innerHTML=`${demoBanner}<div class="panel win"><h2>저장하지 못했습니다</h2><p class="muted">네트워크를 확인한 뒤 다시 시도해 주세요. 이 결과는 아직 집계되지 않았습니다.</p><button class="btn" id="retry">다시 저장</button></div>`; document.getElementById('retry').onclick=()=>finish(winner); return;
  }

  document.getElementById('tostat').onclick=async()=>{ statusScreen(await store.byPid(me.pid)); };

let statusSubscribed=false;
async function statusScreen(mine){
  const render=async()=>{
    let rows; try{ rows=await store.list(); }catch(e){ app.innerHTML=`${demoBanner}<div class="empty">현황을 불러오지 못했습니다. 잠시 뒤 새로고침해 주세요.</div>`; return; }
    const stillMine = rows.find(r=>r.pid===me.pid);
    if(!stillMine){ localStorage.removeItem('wc_done'); return startScreen(); } // 관리자가 기록을 지운 경우 다시 참여 가능
    const w=BY[stillMine.winner];
    app.innerHTML=`${demoBanner}<div class="top"><h1>DTERRA 로고 월드컵 · 실시간 참여 현황</h1></div>
     <div class="notice"><span>이미 참여하셨습니다. 내 우승 로고:</span>${w.lockup}<span class="muted small">${esc(w.name)}</span></div>${statusHTML(rows)}`;
    bindSort(render);
  };
  await render();
  if(!statusSubscribed){ statusSubscribed=true; store.subscribe(render); }
}

function csvEscape(v){ v=String(v??''); return /[",\n]/.test(v)? '"'+v.replace(/"/g,'""')+'"' : v; }
function downloadCSV(rows){
  const head=['이름','완료 시각','우승 ID','우승 이름']; for(let i=1;i<=15;i++) head.push(`판${i}`);
  const lines=[head.join(',')];
  [...rows].reverse().forEach(r=>{ const cells=[r.name,fmt(r.created_at),r.winner,BY[r.winner]?.name||'']; (r.matches||[]).forEach(m=>cells.push(`${m.round}: ${m.a} vs ${m.b} → ${m.pick}`)); lines.push(cells.map(csvEscape).join(',')); });
  const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`DTERRA_로고월드컵_${new Date().toISOString().slice(0,10)}.csv`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
async function adminScreen(pw){
  const render=async()=>{
    let rows; try{ rows=await store.adminList(pw); }catch(e){ app.innerHTML=`<div class="empty">저장소에 연결하지 못했습니다.</div>`; return; }
    const roster=rows.map(r=>{ const w=BY[r.winner]; const open=openPid===r.pid;
      const det= open? `<tr class="detail"><td colspan="5"><div class="mlist">${(r.matches||[]).map(m=>{ const lose=m.pick===m.a?m.b:m.a; return `<div class="m"><span class="r">${esc(m.round)}</span><span class="pick">${esc(BY[m.pick]?.name||m.pick)}</span><span class="muted">vs</span><span class="lose">${esc(BY[lose]?.name||lose)}</span></div>`; }).join('')}</div></td></tr>` : '';
      return `<tr class="person" data-pid="${esc(r.pid)}"><td>${open?'▾':'▸'} ${esc(r.name)}</td><td>${fmt(r.created_at)}</td><td class="thumb">${w?w.lockup:''}</td><td>${esc(w?w.name:r.winner)}</td><td><button class="btn danger sm del" data-pid="${esc(r.pid)}" data-name="${esc(r.name)}">삭제</button></td></tr>${det}`; }).join('');
    app.innerHTML=`${demoBanner}<div class="top"><h1>DTERRA 로고 월드컵 · 관리자</h1><span class="live"><i></i>실시간</span></div>
      <div class="adminbar"><button class="btn ghost" id="csv">CSV 내려받기</button><button class="btn danger" id="reset">결과 전체 초기화</button></div>
      ${statusHTML(rows)}
      <div class="sec"><h3>참여자 명단 <span class="muted small">총 ${rows.length}명 · 최신순 · 이름을 누르면 판별 선택 기록이 펼쳐집니다</span></h3>
      ${rows.length?`<div class="tablewrap"><table><thead><tr><th>이름</th><th>완료 시각</th><th>우승 로고</th><th>우승 이름</th><th></th></tr></thead><tbody>${roster}</tbody></table></div>`:`<div class="empty">아직 참여자가 없습니다.</div>`}</div>`;
    bindSort(render);
    document.getElementById('csv').onclick=()=>downloadCSV(rows);
    document.getElementById('reset').onclick=async()=>{ if(!confirm(`참여 기록 ${rows.length}건을 모두 지웁니다. 되돌릴 수 없습니다. 계속할까요?`)) return; await store.reset(pw); render(); };
    app.querySelectorAll('tr.person').forEach(tr=>tr.onclick=e=>{ if(e.target.closest('.del')) return; openPid = openPid===tr.dataset.pid? null : tr.dataset.pid; render(); });
    app.querySelectorAll('.del').forEach(b=>b.onclick=async e=>{ e.stopPropagation(); if(!confirm(`「${b.dataset.name}」 님의 참여 기록을 지웁니다. 지우면 이 사람이 다시 참여할 수 있습니다. 계속할까요?`)) return; await store.remove(b.dataset.pid,pw); render(); });
  };
  await render();
  if(!adminSubscribed){ adminSubscribed=true; store.subscribe(render); }
}

/* ---------------- 진입 분기 ---------------- */
(async function boot(){
  if(ADMIN_MODE){
    const pw=qs.get('admin')||'';
    try{ await store.adminList(pw); }catch(e){ document.title=''; app.innerHTML=''; return; } // 암호가 틀리면 아무것도 보여 주지 않음(서버에서 확인)
    return adminScreen(pw);
  }
  me.pid=getPid();
  try{ const mine=await store.byPid(me.pid); if(mine) return statusScreen(mine); }
  catch(e){ app.innerHTML=`${demoBanner}<div class="empty">저장소에 연결하지 못했습니다. 잠시 뒤 다시 시도해 주세요.</div>`; console.error(e); return; }
  startScreen();
})();
})();
</script>
